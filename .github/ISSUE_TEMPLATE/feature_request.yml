name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! SerieusTracker is local-first and privacy-focused, and it does not link to or help to find content. Ideas that need an account, a server, tracking, or links to unlicensed content will not be accepted. See `CONTRIBUTING.md`.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature as you imagine it. Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Lists and views
        - Show details and episodes
        - Search and data sources
        - Plex integration
        - Export / import and file format
        - Languages
        - Design and accessibility
        - Something else
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - No, I am just suggesting it
        - Yes, I would like to try
        - Maybe, with some guidance
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this has not been suggested
          required: true
